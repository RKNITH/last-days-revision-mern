<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href="styles.css" />
    <title>Calculator UI</title>
</head>

<body>
    <div class="container">
        <div class="heading">
            <h1>Calculator</h1>
        </div>
        <div class="input-field">
            <input id="input" type='text' readonly />
        </div>
        <div class="buttons-container " id="buttons">
            <button>AC</button>
            <button>DEL</button>
            <button>*</button>
            <button>/</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
            <button>.</button>
            <button id="equal">=</button>
        </div>
    </div>

    <script src="index.js" charset="UTF-8"></script>
</body>

</html>
